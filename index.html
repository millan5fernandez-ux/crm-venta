<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#ff3b3b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bitácora"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bitácora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23ff3b3b%22/%3E%3Cpath d=%22M7 25V7h4l5 8 5-8h4v18h-4V14.5l-4.2 6.6h-1.6L11 14.5V25z%22 fill=%22%230b0b0b%22/%3E%3Crect x=%2225%22 y=%223%22 width=%224%22 height=%224%22 fill=%22%230b0b0b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera fija con pestañas; cada módulo = fila de tarjetas (formulario, métricas, gráficas) y lista editable debajo. */
/* Estilo inspirado en Spotify (awesome-design-md): superficies casi negras, acento verde solo para activo/CTA, píldoras, sombras marcadas */
:root{
  --font-display:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-body:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;
  --bg:#121212; --card:#181818; --ink:#ffffff; --ink2:#b3b3b3; --muted:#8c8c8c; --line:#2a2a2a; --soft:#1f1f1f;
  --accent:#1ed760; --accent-ink:#000000;
  --s1:#1ed760; --s2:#ffa42b; --s3:#539df5; --s4:#f3727f; --s5:#c490ff; --s6:#b3b3b3;
  --good:#1ed760; --warn:#ffa42b; --bad:#f3727f;
  --pill-good:#12301a; --pill-warn:#3a2d0c; --pill-bad:#3b1a1f; color-scheme:dark;
  --shadow:rgba(0,0,0,.3) 0 8px 8px; --shadow-lg:rgba(0,0,0,.5) 0 8px 24px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding-block:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
h1{font:700 28px/1.1 var(--font-display);margin:0;letter-spacing:-.02em}
.date{color:var(--ink2);font-size:14px;text-transform:capitalize}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;font-weight:500;border:1px solid transparent}
.tab:hover{background:var(--soft)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:16px;display:flex;flex-direction:column;gap:12px}
h2{font:700 20px/1.2 var(--font-display);margin:0 0 2px;letter-spacing:-.01em}
h3{font:600 12px/1.2 var(--font-body);margin:0 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tl{margin:0;color:var(--ink2);font-size:13px}
.tv{margin:2px 0 8px;font:700 28px/1.1 var(--font-display);letter-spacing:-.02em}
.tv small{font:500 14px var(--font-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.ts{margin:8px 0 0;color:var(--ink2);font-size:13px}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--c,var(--s1));border-radius:0 4px 4px 0}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.good{background:var(--pill-good);color:var(--good)}.pill.warn{background:var(--pill-warn);color:var(--warn)}.pill.bad{background:var(--pill-bad);color:var(--bad)}
.banner{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--pill-warn);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.banner p{margin:0;min-width:0}
.hvin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.hvin:focus-visible+.hvpick{outline:2px solid var(--ink)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px;color:var(--ink2)}
.f.wide{grid-column:span 2}
input,select{font:16px var(--font-body);background:var(--soft);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:10px;width:100%;min-width:0}
.fa{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:6px}
.nav{display:flex;gap:6px;align-items:center}
.nav strong{min-width:130px;text-align:center;font-family:var(--font-display)}
.nav strong::first-letter{text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.rd{color:var(--muted);font-size:13px;text-transform:capitalize}
.rt{font-weight:500;overflow-wrap:anywhere}
.rs{color:var(--ink2);font-size:13px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.rv{font:600 15px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ra{display:inline-flex;gap:8px}
.ic{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.ic.danger{color:var(--bad);font-weight:600}
.grp{margin:14px 0 0;font-size:12px;font-weight:600;color:var(--ink2);text-transform:capitalize;letter-spacing:.04em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.empty{color:var(--muted);margin:10px 0}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;position:relative;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-position:0 0}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:default}
.col i{display:block;width:100%;background:var(--c,var(--s1));border-radius:4px 4px 0 0}
.col:hover i{filter:brightness(1.12)}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink2);pointer-events:none}
.goal span{position:absolute;right:0;bottom:2px;font-size:11px;color:var(--ink2);background:var(--card);padding:0 4px;border-radius:4px}
.xl{display:flex;gap:3px;margin-top:4px;font-size:11px;color:var(--muted)}
.xl span{flex:1;min-width:0;text-align:center;overflow:visible;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(72px,112px) minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hl{display:flex;align-items:center;color:var(--ink2);min-width:0}
.hl s{flex:none;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tr{height:10px;background:var(--soft);border-radius:5px;position:relative}
.tr b{display:block;height:100%;background:var(--c,var(--s1));border-radius:0 4px 4px 0;min-width:2px}
.tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.hv{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500;min-width:54px;text-align:right}
.stack{display:flex;gap:2px;height:12px}
.stack b{display:block;background:var(--c);border-radius:3px;min-width:2px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink2)}
.line{width:100%;min-height:60px}
.ln text{fill:var(--muted);font:11px var(--font-body)}
.ln .grid{stroke:var(--line);stroke-width:1}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:8px;max-width:260px}
#sync{color:var(--muted);font-size:12px}
.hero{text-align:left}
.hero .fa{margin-top:14px}
textarea{width:100%;min-height:90px;font:12px/1.4 monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
@media (prefers-reduced-motion:no-preference){.meter b,.tr b,.col i{transition:height .25s,width .25s}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes gw{from{transform:scaleX(0)}}
@keyframes gh{from{transform:scaleY(0)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@media (prefers-reduced-motion:no-preference){
  #view.anim>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
  #view.anim .meter b,#view.anim .tr b,#view.anim .stack b{transform-origin:0 50%;animation:gw .9s cubic-bezier(.2,.7,.2,1) .25s both}
  #view.anim .col i{transform-origin:bottom;animation:gh .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--d,0)*22ms)}
  #view.anim .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease-out .3s forwards}
  #view.anim .ar{animation:fadein .9s ease-out .9s both}
  #view.anim .pt{transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out 1.2s both}
  .tile,.card{transition:transform .2s,border-color .2s}
  .tile:hover,.card:hover{transform:translateY(-2px);border-color:var(--muted)}
  .tab{transition:background .2s,color .2s}
}
/* ---- Escritorio 3D: escena a pantalla completa, HUD de cristal y cajón de módulo ---- */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-9999px,0);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;white-space:nowrap;
  font:inherit;color:var(--ink);padding:6px 11px 6px 12px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--c);
  background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tag b{font:700 13px/1.2 var(--font-display)}
.tag span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tag.on,.tag:hover{border-color:var(--c);box-shadow:0 4px 18px rgba(0,0,0,.14)}
.hud{position:fixed;z-index:10}
.glass{background:var(--card);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}
.hud-top{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px 14px;align-items:center;pointer-events:none}
.hud-top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;padding:8px 14px;flex:none}
.brand strong{font:700 18px/1.1 var(--font-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink2)}
.brand span::first-letter{text-transform:uppercase}
.hud-top nav.tabs{padding:5px;gap:2px;min-width:0;max-width:100%}
.hud-top .tab{padding:6px 12px;font-size:14px}
.hud-kpis{top:calc(78px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.kpi{font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-width:128px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;
  background:var(--card);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}
.kpi:hover{border-color:var(--accent)}
.kpi .kl{font-size:12px;color:var(--ink2)}
.kpi strong{font:700 19px/1.15 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{font:500 12px var(--font-body);color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi .ks{font-size:12px;color:var(--ink2)}
.hud-ctl{right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.hud-ctl button{width:40px;height:40px;border-radius:12px;font:600 18px/1 var(--font-body);color:var(--ink);cursor:pointer;
  background:var(--card);background:color-mix(in srgb,var(--card) 84%,transparent);border:1px solid var(--line)}
.hud-ctl button:hover{border-color:var(--accent)}
.hud-week{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100% - 32px));padding:12px 14px}
.hud-feed{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));padding:12px 14px}
.hud h3{margin:0 0 8px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);text-transform:uppercase}
.d{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none}
.d.g.on{background:var(--s2);border-color:var(--s2)}
.d.k.on{background:var(--s3);border-color:var(--s3)}.d.k.mid{border-color:var(--s3)}
.d.e.on{background:var(--s1);border-color:var(--s1)}.d.e.bad{background:var(--bad);border-color:var(--bad)}
.lg{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg .d{width:10px;height:10px;border-width:2px}
.frow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.frow .rt{display:flex;flex-direction:column;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .rt small{color:var(--muted);font-size:11px}
.frow .rv{font-size:13px}
.hint{position:fixed;z-index:9;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 16px;
  transform:translateX(102%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
body.drawer-open #drawer{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));margin:calc(-16px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.dhead h2{font:700 22px/1.1 var(--font-display);margin:0}
.no3d #c,.no3d #tags,.no3d .hud-ctl,.no3d .hint{display:none}
@media (min-width:861px){
  body.drawer-open .hud-top{right:calc(min(520px,100%) + 16px)}
  body.drawer-open .hud-ctl{right:calc(min(520px,100%) + 16px)}
  body.drawer-open .hud-feed,body.drawer-open .hint{display:none}
}
@media (max-width:860px){
  #drawer{top:auto;height:82%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding-left:max(16px,env(safe-area-inset-left,0px));transform:translateY(102%)}
  .dhead{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));top:-16px;margin-top:-16px;padding-top:14px;border-radius:18px 18px 0 0}
  body.drawer-open .hud-kpis,body.drawer-open .hud-week,body.drawer-open .hud-feed,body.drawer-open .hud-ctl{display:none}
  .hud-top{flex-wrap:wrap}
  .brand{display:none}
  .hud-top nav.tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;width:100%}
  .hud-kpis{top:calc(62px + env(safe-area-inset-top,0px));flex-wrap:nowrap;overflow-x:auto;right:max(16px,env(safe-area-inset-right,0px));max-width:none;scrollbar-width:none}
  .kpi{min-width:132px;padding:8px 12px}.kpi strong{font-size:18px}
  .hud-feed,.hint{display:none}
  .tag span{display:none}.tag{padding:4px 9px 4px 10px}.tag b{font-size:12px}
  .hud-week{padding:8px 12px;width:min(300px,calc(100% - 32px))}.hud-week h3{margin-bottom:6px}.hud-week .lg{display:none}.hud-week .wk{gap:4px}
  .hud-ctl{top:auto;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:none;flex-direction:row;left:auto}.hud-ctl button{width:36px;height:36px}
}

/* ---- Calendario y Personal ---- */
.f.full{grid-column:1/-1}
.fl::first-letter{text-transform:uppercase}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mo{position:relative;display:block}
.mo input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.mo span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);cursor:pointer;color:var(--ink);font-size:14px}
.mo i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.mo input:checked+span{border-color:var(--c);background:var(--card);box-shadow:inset 0 0 0 1px var(--c);font-weight:600}
.mo input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ch{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;padding:2px 0 4px}
.cd{font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:10px;min-height:54px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.cd.out{opacity:.45}
.cd:hover{border-color:var(--muted)}
.cd>span:first-child{min-width:24px;padding:1px 5px;text-align:center;border-radius:999px;font-variant-numeric:tabular-nums}
.cd.today>span:first-child{background:var(--accent);color:var(--accent-ink);font-weight:600}

.btn:hover,.chip:hover,.seg button:hover{background:var(--ink);color:var(--page);transform:none}
.btn.primary{background:var(--accent);color:#0b0b0b;border-color:var(--edge);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;font-weight:700}

.btn.danger:hover{background:var(--bad);color:#fff}
.chip{padding:5px 10px;border-color:var(--line);font-size:11px}.chip[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.seg button{padding:12px}.seg button.on{background:var(--accent);color:#0b0b0b;border-color:var(--edge);box-shadow:none}.seg button.on.off{background:var(--ink);color:var(--page)}

input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);box-shadow:none;font-family:var(--font-body)}
input:hover,select:hover,textarea:hover{border-color:var(--ink2)}

.f{color:var(--ink2);font:600 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}

.tv{font:700 32px/1.05 var(--font-mono);letter-spacing:-.06em}.tl,.ts{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tv small{font-family:var(--font-mono)}
.meter,.tr{background:var(--soft);border:1px solid var(--line);border-radius:0;box-shadow:none;height:10px}
.meter b,.tr b,.stack b{background:var(--c,var(--s1));box-shadow:none;border-radius:0}
.pill{border-radius:2px;font:700 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor}
.banner{background:var(--pill-warn);color:var(--ink);border:1px solid var(--edge);border-radius:2px}
.gdv,.cd{background:var(--card);border:1px solid var(--line);border-radius:2px}
.gdv:hover,.cd:hover{border-color:var(--ink)}
.gdv.went{background:var(--pill-good);border-color:var(--good)}.gdv.rest{background:var(--soft)}
.gdv.sel,.cd.sel{background:var(--soft);box-shadow:inset 0 0 0 2px var(--ink);border-color:var(--ink)}
.gdv.today .gn{background:none;color:var(--accent)}
.cd.today>span:first-child{background:var(--accent);color:#0b0b0b;border-radius:2px}
.gpc{background:var(--soft);border:1px solid var(--line);border-radius:2px;font:600 11px var(--font-mono)}.gpc.ok{background:var(--pill-good);color:var(--good);border-color:var(--good)}
.cols{border-bottom-color:var(--edge);background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.goal{border-top-color:var(--ink)}.goal span{background:var(--card);color:var(--ink2);font-family:var(--font-mono)}
.col i{box-shadow:none;border-radius:0}
.row,.wt th,.wt td{border-top-color:var(--line)}
.gdv .gl,.ch,.gs-h,.xl,.wd{font-family:var(--font-mono);letter-spacing:.08em}
.chk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page);box-shadow:none}
#tip{background:var(--ink);color:var(--page);border:0;border-radius:2px;font:600 11px var(--font-mono);backdrop-filter:none;-webkit-backdrop-filter:none}
.theme-btn{display:inline-flex;align-items:center;gap:10px}
.sw{position:relative;width:34px;height:18px;border:1px solid var(--edge);border-radius:999px;background:var(--soft);flex:none;transition:background .2s}
.sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:transform .22s cubic-bezier(.2,.8,.2,1),background .2s}
.theme-btn[aria-checked="true"] .sw{background:var(--accent)}

.theme-btn:hover .sw i{background:var(--page)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--page)}::-webkit-scrollbar-track{background:transparent}

/* Animaciones del dashboard */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes sheen{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
body.intro .big{animation:slidein 1.19s cubic-bezier(.2,.8,.2,1) both}
body.intro #clock{animation:rise 1.02s 0.26s cubic-bezier(.2,.8,.2,1) both}

body.intro #acct{animation:rise 0.94s 0.94s both}
body.intro #dgrid>*{animation:rise 1.02s cubic-bezier(.2,.8,.2,1) both}
body.intro #stage{animation-delay:1.02s}body.intro #chart{animation-delay:1.19s}body.intro #upnext{animation-delay:1.36s}body.intro #feed{animation-delay:1.53s}body.intro #week{animation-delay:1.7s}body.intro #quickc{animation-delay:1.87s}

#clock .ckt i{font-style:normal;animation:blink 1.4s steps(1) infinite}

#feed:hover,#week:hover,#chart:hover,#upnext:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--edge)}
#quickc .qa{transition:transform 0.26s ease}#quickc .qa:hover{transform:translateX(5px)}
.big span{background:linear-gradient(100deg,var(--accent) 42%,#ff8f8f 50%,var(--accent) 58%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 8.5s linear infinite}

.sw i{transition:transform .22s cubic-bezier(.2,.8,.2,1),width .2s,background .2s}

  html,body{height:100%;overflow:hidden}

function sbMerge(a,b){

    var rn={};if(k==='routines')(out[k]||[]).forEach(function(x){rn[(x.name||'').toLowerCase()]=1});

function niceStep(raw){var p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<=1.5?1:m<=3.5?2:m<=7.5?5:10)*p}
function lineSVG(o,w,h){
  var pts=o.pts;
  if(!pts.length)return '<p class="empty">Sin datos todavía.</p>';
  var L=42,R=12,T=10,B=22;
  var xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);if(x0===x1){x0-=1;x1+=1}
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys),py=(y1-y0)*.15||1;y0-=py;y1+=py;
  var step=niceStep((y1-y0)/3),t=Math.ceil(y0/step)*step,ticks=[];
  for(;t<=y1;t+=step)ticks.push(+t.toFixed(4));
  var X=function(x){return L+(x-x0)/(x1-x0)*(w-L-R)},Y=function(y){return T+(1-(y-y0)/(y1-y0))*(h-T-B)};
  var s='<svg class="ln" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.aria||'Gráfica de línea')+'">';
  ticks.forEach(function(v){s+='<line class="grid" x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+num(v,step<1?1:0)+'</text>'});
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)}).join('');
  var bottom=(h-B).toFixed(1);
  s+='<path d="'+d+'L'+X(pts[pts.length-1].x).toFixed(1)+' '+bottom+'L'+X(pts[0].x).toFixed(1)+' '+bottom+'Z" class="ar" fill="'+(o.color||'var(--s1)')+'" fill-opacity=".12" stroke="none"/>';
  s+='<path class="dr" pathLength="1" d="'+d+'" fill="none" stroke="'+(o.color||'var(--s1)')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    if(last||pts.length<=40)s+='<circle class="pt" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5:3)+'" fill="'+(o.color||'var(--s1)')+'" stroke="var(--card)" stroke-width="2"/>';
    s+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="11" fill="transparent" data-tip="'+esc(p.tip)+'"/>';
  });
  s+='<text x="'+X(pts[0].x).toFixed(1)+'" y="'+(h-5)+'" text-anchor="start">'+esc(pts[0].label)+'</text>';
  if(pts.length>1)s+='<text x="'+X(pts[pts.length-1].x).toFixed(1)+'" y="'+(h-5)+'" text-anchor="end">'+esc(pts[pts.length-1].label)+'</text>';
  return s+'</svg>';
}

var RGROUPS=[{n:'Pecho',m:['Pecho']},{n:'Core',m:['Core']},{n:'Hombros',m:['Hombro']},{n:'Brazos',m:['Bíceps','Tríceps']},{n:'Piernas',m:['Cuádriceps','Isquios','Glúteo','Gemelo']},{n:'Espalda',m:['Espalda']}];
function radarChart(live){
  var ws=weekStart(today()),pw=addDays(ws,-7),src=S.gym;
  if(live&&ui.sess&&ui.sess.went&&ui.sess.items&&ui.sess.items.length){
    src=S.gym.filter(function(g){return g.date!==ui.sess.date}).concat(ui.sess.items.filter(function(i){return i.exercise}).map(function(i){return {date:ui.sess.date,muscle:i.muscle,rows:i.rows.filter(function(x){return +x.r||+x.k}).map(function(x){return {r:+x.r||0,k:+x.k||0,t:x.t}})}}));
  }
  function cnt(a,b,ms){return sum(src.filter(function(g){return g.date>=a&&g.date<=b&&ms.indexOf(g.muscle)>-1}),wsets)}
  var cur=RGROUPS.map(function(r){return cnt(ws,addDays(ws,6),r.m)}),prev=RGROUPS.map(function(r){return cnt(pw,addDays(pw,6),r.m)});
  var mx=Math.max.apply(null,[6].concat(cur,prev)),N=RGROUPS.length,cx=170,cy=140,R=95;
  function pt(i,v){var a=-Math.PI/2+i*2*Math.PI/N+Math.PI/N,r=R*v/mx;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]}
  var g='',lv=4,k,i;
  for(k=1;k<=lv;k++){var ring=[];for(i=0;i<N;i++)ring.push(pt(i,mx*k/lv).map(function(x){return x.toFixed(1)}).join(','));g+='<polygon points="'+ring.join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>'}
  for(i=0;i<N;i++){var e=pt(i,mx),l=pt(i,mx*1.22);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)"/><text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="'+(l[0]<cx-8?'end':l[0]>cx+8?'start':'middle')+'" font-size="12" fill="var(--muted)" font-family="var(--font-mono)">'+RGROUPS[i].n+'</text>'}
  function poly(a,fill,stroke,w){return '<polygon points="'+a.map(function(v,i){return pt(i,v).map(function(x){return x.toFixed(1)}).join(',')}).join(' ')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+'" stroke-linejoin="round"/>'}
  g+=poly(prev,'var(--muted)','var(--muted)',2).replace('fill="var(--muted)"','fill="var(--muted)" fill-opacity=".18"')+poly(cur,'var(--accent)','var(--accent)',2.5).replace('fill="var(--accent)"','fill="var(--accent)" fill-opacity=".25"');
  cur.forEach(function(v,i){var p=pt(i,v);g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--accent)"><title>'+RGROUPS[i].n+': '+v+' series esta semana · '+prev[i]+' la anterior</title></circle>'});
  var desc=RGROUPS.map(function(r,i){return r.n+' '+cur[i]+' (antes '+prev[i]+')'}).join(', ');
  return '<svg viewBox="0 0 340 290" role="img" aria-label="Series por grupo muscular, semana actual frente a la anterior: '+esc(desc)+'" style="width:100%;max-width:420px;height:auto;display:block;margin:0 auto">'+g+'</svg><div class="legend" style="justify-content:center"><span><span class="dot" style="--c:var(--accent)"></span>Actual</span><span><span class="dot" style="--c:var(--muted)"></span>Anterior</span></div>';
}

TPL[T_PHB]=[['Press banca','Pecho',4],['Press inclinado con mancuernas','Pecho',3],['Aperturas en polea','Pecho',3],['Press militar','Hombro',3],['Elevaciones laterales','Hombro',3],['Curl con barra','Bíceps',3],['Curl martillo','Bíceps',3]];

TPL.Pierna=[['Sentadilla','Cuádriceps',4],['Peso muerto rumano','Isquios',3],['Prensa','Cuádriceps',3],['Hip thrust','Glúteo',3],['Gemelo en prensa','Gemelo',4]];

function exOptions(m){
  var o=(CATALOG[m]||[]).slice();
  Object.keys(TPL).forEach(function(k){TPL[k].forEach(function(x){if(x[1]===m&&o.indexOf(x[0])<0)o.push(x[0])})});
  (S.routines||[]).forEach(function(r){r.items.forEach(function(x){if(x.muscle===m&&o.indexOf(x.exercise)<0)o.push(x.exercise)})});
  S.gym.forEach(function(g){if(g.muscle===m&&o.indexOf(g.exercise)<0)o.push(g.exercise)});
  return o;
}
function lastOf(name,before){
  var n=name.trim().toLowerCase();
  return S.gym.filter(function(x){return x.exercise.toLowerCase()===n&&x.date<before}).sort(cmpDesc)[0]||null;
}
function routineDef(tag){
  var n=(tag||'').toLowerCase(),c=(S.routines||[]).filter(function(r){return r.name.toLowerCase()===n})[0];
  if(c)return c.items.map(function(i){return [i.exercise,i.muscle,i.n||3]});
  return TPL[tag]||[];
}
function allTags(){
  var o=GTAGS.slice();(S.routines||[]).forEach(function(r){if(o.map(function(x){return x.toLowerCase()}).indexOf(r.name.toLowerCase())<0)o.push(r.name)});
  return o;
}
function tplItems(tag,date){
  return routineDef(tag).map(function(t){
    var rows=[],pre=false,last=lastOf(t[0],date);
    if(last){var lr=setsOf(last).map(function(x){return {r:x.r?String(x.r):'',k:x.k?String(x.k):'',t:x.t}}).filter(function(x){return x.r||x.k});if(lr.length){rows=lr;pre=true}}
    if(!rows.length)for(var i=0;i<t[2];i++)rows.push({r:'',k:'',t:i===0?'w':'n'});
    return {k:uid8(),exercise:t[0],muscle:t[1],rows:rows,src:tag,pre:pre};
  });
}
function loadDay(date){
  var gd=S.gymdays.filter(function(g){return g.date===date})[0];
  var recs=S.gym.filter(function(g){return g.date===date});
  var s={date:date,went:null,tags:[],items:[],note:'',exists:false};
  if(gd){s.went=!!gd.went;s.tags=gmig(gd.routine);s.note=gd.note||'';s.exists=true}
  else if(recs.length){s.went=true;s.exists=true}
  s.items=recs.map(function(r){return {k:uid8(),exercise:r.exercise,muscle:r.muscle,rows:setsOf(r).map(function(x){return {r:x.r||'',k:x.k||'',t:x.t}}),src:'',t:1}});
  return s;
}
function toggleTag(tag){
  var s=ui.sess,i=s.tags.indexOf(tag);
  if(i>-1){
    s.tags.splice(i,1);
    s.items=s.items.filter(function(it){return !(it.src===tag&&!it.t)});
  }else{
    s.tags.push(tag);
    tplItems(tag,s.date).forEach(function(n){
      var dup=s.items.some(function(it){return it.exercise.trim().toLowerCase()===n.exercise.toLowerCase()});
      if(!dup)s.items.push(n);
    });
  }
}
function deleteDay(date){
  S.gymdays=S.gymdays.filter(function(g){return g.date!==date});
  S.gym=S.gym.filter(function(g){return g.date!==date});
  if(ui.sess&&ui.sess.date===date)ui.sess=loadDay(date);
  commit();
}
function dayInfo(d){
  var gd=S.gymdays.filter(function(g){return g.date===d})[0];
  var has=S.gym.some(function(g){return g.date===d});
  return {known:!!gd||has,went:gd?!!gd.went:has,tags:gd?gmig(gd.routine):[]};
}
function nfill(i){return (i.rows||[]).filter(function(x){return x.t!=='w'&&(fnum(x.r)>0||fnum(x.k)>0)}).length}
function sessWeek(){
  var s=ui.sess,ws=weekStart(s.date),we=addDays(ws,6),base={},add={};
  S.gym.forEach(function(g){if(g.date>=ws&&g.date<=we&&g.date!==s.date)base[g.muscle]=(base[g.muscle]||0)+wsets(g)});
  s.items.forEach(function(i){var n=nfill(i);if(n>0&&(i.exercise||'').trim())add[i.muscle]=(add[i.muscle]||0)+n});
  return {base:base,add:add};
}
function previewHtml(){

  return '<p class="ts" style="margin:0 0 6px">Así quedaría la semana con esta sesión</p><div class="gp">'+ms.map(function(m){
    var tot=(w.base[m]||0)+w.add[m],ok=glo(m)&&tot>=glo(m);

/* Calendario */
var KINDS=[{k:'Gym',c:'var(--s2)'},{k:'Salud',c:'var(--s3)'},{k:'Estudios',c:'var(--s1)'},{k:'Social',c:'var(--s5)'},{k:'Otro',c:'var(--s4)'}];
var kindColor=function(k){var x=KINDS.filter(function(q){return q.k===k})[0];return x?x.c:'var(--s4)'};
function relDay(d){var n=dn(d)-dn(today());return n===0?'Hoy':n===1?'Mañana':n===-1?'Ayer':n>1?'En '+n+' días':'Hace '+(-n)+' días'}
function planSort(a,b){var x=a.time||'99',y=b.time||'99';return a.date===b.date?(x<y?-1:x>y?1:0):(a.date<b.date?-1:1)}
function nextPlan(){var t=today();return S.plans.filter(function(p){return !p.done&&p.date>=t}).sort(planSort)[0]||null}
VIEWS.metas=function(){
  var t=today(),month=ui.cal||t.slice(0,7),sd=ui.sel||t;
  var Y=+month.slice(0,4),M=+month.slice(5),first=month+'-01',off=(parse(first).getDay()+6)%7,dim=new Date(Y,M,0).getDate();
  var start=addDays(first,-off),total=Math.ceil((off+dim)/7)*7,cells='';
  for(var i=0;i<total;i++){
    var d=addDays(start,i),inM=d.slice(0,7)===month;
    var ps=S.plans.filter(function(p){return p.date===d});
    var dots=ps.slice(0,3).map(function(p){return '<i style="--c:'+kindColor(p.kind)+'"></i>'}).join('');
    cells+='<button class="cd'+(inM?'':' out')+(d===t?' today':'')+(d===sd?' sel':'')+'" data-act="seldate" data-d="'+d+'" aria-pressed="'+(d===sd)+'" aria-label="'+esc(fdate(d))+(ps.length?', '+ps.length+(ps.length>1?' planes':' plan'):'')+'"><span>'+(+d.slice(8))+'</span><span class="cdots">'+dots+'</span></button>';
  }
  var head=['L','M','X','J','V','S','D'].map(function(x){return '<span class="ch">'+x+'</span>'}).join('');
  var inMonth=S.plans.filter(function(p){return p.date.startsWith(month)});
  var np=nextPlan();
  var e=curEdit('plans'),d0=e?e.date:sd;
  var form=formWrap('plans','Nuevo plan',
    fld('plans','date','Fecha','date',d0,'required')+
    fld('plans','time','Hora (opcional)','time',e&&e.time?e.time:'','')+
    fld('plans','title','Qué vas a hacer','text',e?e.title:'','required maxlength="80" placeholder="Pierna, examen de redes, cumpleaños…"','full')+
    sel('plans','kind','Tipo',KINDS.map(function(k){return k.k}),e?e.kind:'Otro','full'));
  var up=S.plans.filter(function(p){return !p.done&&p.date>=t}).sort(planSort).slice(0,6);
  var upHtml=up.length?'<ul class="rows">'+up.map(function(p){return '<li class="row"><span class="rd">'+fshort(p.date)+'</span><span><button class="ic plink" data-act="seldate" data-d="'+p.date+'">'+esc(p.title)+'</button><span class="rs"><span><span class="dot" style="--c:'+kindColor(p.kind)+'"></span>'+esc(p.kind)+'</span><span>'+relDay(p.date)+(p.time?' · '+esc(p.time):'')+'</span></span></span><span class="rv"></span></li>'}).join('')+'</ul>':'<p class="empty">No tienes planes próximos. Añade el primero arriba.</p>';
  var selTxt=parse(sd).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return '<div class="bar"><h2>Calendario</h2><div class="nav"><button class="btn" data-act="calmonth" data-d="-1" aria-label="Mes anterior">←</button><strong>'+esc(new Date(Y,M-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}))+'</strong><button class="btn" data-act="calmonth" data-d="1" aria-label="Mes siguiente">→</button><button class="btn" data-act="caltoday">Hoy</button></div></div>'+
  '<div class="tiles">'+
    tile('Planes del mes',String(inMonth.length),'','',(function(n){return n+(n===1?' hecho':' hechos')})(sum(inMonth,function(p){return p.done?1:0})))+
    tile('Próximo plan',np?esc(np.title.length>22?np.title.slice(0,21)+'…':np.title):'—','','',np?relDay(np.date)+(np.time?' · '+esc(np.time):''):'Sin planes')+
  '</div>'+
  '<div class="card"><div class="cal">'+head+cells+'</div></div>'+
  '<div class="card"><h3 class="fl">'+esc(selTxt)+'</h3><div id="list">'+LISTS.metas()+'</div></div>'+
  form+

function gsapIn(vw){
  if(tl)tl.kill();

  tl.from(vw.children,{y:28,opacity:0,duration:.65,stagger:.09,clearProps:'transform,opacity'},0);
  var tiles=q('.tile');
  if(tiles.length)tl.from(tiles,{scale:.94,duration:.6,stagger:.07,ease:'back.out(1.6)',clearProps:'transform'},.1);
  var bars=q('.meter b,.tr b,.stack b');
  if(bars.length)tl.from(bars,{scaleX:0,transformOrigin:'0 50%',duration:1,stagger:.04,ease:'power4.out',clearProps:'transform'},.35);
  var cl=q('.col i');
  if(cl.length)tl.from(cl,{scaleY:0,transformOrigin:'50% 100%',duration:.9,stagger:{each:.02,from:'start'},ease:'back.out(1.3)',clearProps:'transform'},.3);
  var paths=q('.dr');
  if(paths.length){

    tl.from(q('.ar'),{opacity:0,duration:.8},1.1);
    tl.from(q('.pt'),{scale:0,transformBox:'fill-box',transformOrigin:'50% 50%',duration:.4,stagger:.015,ease:'back.out(3)',clearProps:'transform'},1.0);
  }

function countUp(root){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  root.querySelectorAll('.tv').forEach(function(el){
    var n=el.firstChild;if(!n||n.nodeType!==3)return;
    var m=n.nodeValue.match(/\d[\d.]*(?:,\d+)?/);if(!m)return;
    var txt=n.nodeValue,raw=m[0],dec=raw.indexOf(',')>-1?raw.split(',')[1].length:0;
    var target=parseFloat(raw.replace(/\./g,'').replace(',','.'));if(!isFinite(target)||target===0)return;
    var pre=txt.slice(0,m.index),post=txt.slice(m.index+raw.length),t0=null,dur=900;
    function frame(ts){
      if(!n.parentNode)return;
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
      n.nodeValue=pre+(p>=1?txt.slice(m.index,m.index+raw.length):num(target*e,dec))+post;
      if(p<1)requestAnimationFrame(frame);
    }
    n.nodeValue=pre+num(0,dec)+post;
    requestAnimationFrame(frame);
  });
}

function csvParse(txt){
  txt=txt.replace(/^﻿/,'');

  var rows=[],row=[],cur='',q=false,i=0,c;
  for(;i<txt.length;i++){c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else cur+=c}

}
var HV_MES={ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,set:9,oct:10,nov:11,dic:12,dec:12};
function hvDate(v){

function csvFindCols(H){var ix={};Object.keys(CSV_ALIAS).forEach(function(k){ix[k]=-1;for(var j=0;j<CSV_ALIAS[k].length&&ix[k]<0;j++)ix[k]=H.indexOf(CSV_ALIAS[k][j])});return ix}
function csvSrc(H){var h=function(n){return H.indexOf(n)>-1};return h('set_type')&&h('start_time')?'Hevy':(h('set order')||h('workout name'))?'Strong':h('iswarmup')?'Fitbod':(h('category')&&h('distance unit'))?'FitNotes':'CSV'}
function hvParse(txt){

function hvParseRows(R,ixx,unit,src){
  var iT=ixx.ti,iS=ixx.date,iE=ixx.ex,iY=ixx.ty,iW=ixx.w,iR=ixx.r;
  var days={},skipped=0,sets=0,origOf={};
  R.slice(1).forEach(function(r){
    var d=hvDate(r[iS]);if(!d||!r[iE])return;
    var reps=fnum(r[iR])||0,kg=fnum(r[iW])||0;if(unit==='lb')kg=Math.round(kg*0.45359237*10)/10;
    if(!(reps>0||kg>0)){skipped++;return}
    var D=days[d]||(days[d]={date:d,titles:[],ex:[],byName:{}});
    var tt=iT>=0?(r[iT]||'').trim():'';if(tt&&D.titles.indexOf(tt)<0)D.titles.push(tt);
    var name=esEx(r[iE].trim()),E=D.byName[name];origOf[name]=r[iE].trim();
    if(!E){E={name:name,rows:[]};D.byName[name]=E;D.ex.push(E)}
    var ty=(iY>=0?r[iY]:'').trim().toLowerCase();
    E.rows.push({r:Math.round(reps),k:kg,t:(ty==='warmup'||ty==='w'||ty==='true'||ty==='yes')?'w':(ty==='failure'||ty==='f')?'f':'n'});sets++;
  });

  if(!list.length)throw new Error('sin datos');

  return {days:list,map:map,names:names,skipped:skipped,sets:sets,over:true,src:src||'CSV'};
}

function bankNum(v){
  var s=String(v==null?'':v).replace(/[^\d,.\-+]/g,'');if(!s||!/\d/.test(s))return null;
  var c=s.lastIndexOf(','),d=s.lastIndexOf('.');
  if(c>-1&&d>-1){if(c>d)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(c>-1){s=(s.match(/,/g).length>1)?s.replace(/,/g,''):s.replace(',','.')}
  else if(d>-1&&s.match(/\./g).length>1)s=s.replace(/\./g,'');
  var n=parseFloat(s);return isNaN(n)?null:n;
}
function bankDate(v,f){
  v=(v||'').trim();var m;
  if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];

function bankCat(t){var last=CATS[CATS.length-1].k;for(var i=0;i<BK_CAT.length;i++)if(BK_CAT[i][1].test(t)&&catKnown(BK_CAT[i][0]))return BK_CAT[i][0];return last}
function bankRows(b){
